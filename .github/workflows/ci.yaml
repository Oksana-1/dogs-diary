name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Tests and static checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            APP_ENV: test

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, pdo_sqlite
                  coverage: none

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'

            - name: Validate Composer metadata
              run: composer validate --strict --no-check-publish

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Audit PHP dependencies
              run: composer audit --locked --abandoned=fail --no-interaction

            - name: Run PHPUnit
              run: php bin/phpunit

            - name: Run JavaScript tests
              run: node --test tests/JavaScript/FetchClient.test.mjs

            - name: Check PHP formatting
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Validate Symfony configuration and templates
              run: |
                  php bin/console lint:yaml config --parse-tags
                  php bin/console lint:twig templates
                  php bin/console lint:container

    database:
        name: PostgreSQL migrations and schema
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            APP_ENV: test
            DATABASE_URL: 'postgresql://app:ci_password@127.0.0.1:5432/app_ci?serverVersion=16&charset=utf8'

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: app_ci_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: ci_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -d app_ci_test -U app"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, pdo_pgsql
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Run migrations on a clean PostgreSQL database
              run: php bin/console doctrine:migrations:migrate --no-interaction

            - name: Validate Doctrine mapping and schema
              run: php bin/console doctrine:schema:validate
