# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MEDIA_STORAGE): 'local'
    env(MEDIA_R2_ENDPOINT): ''
    env(MEDIA_R2_REGION): 'auto'
    env(MEDIA_R2_BUCKET): ''
    env(MEDIA_R2_ACCESS_KEY_ID): ''
    env(MEDIA_R2_SECRET_ACCESS_KEY): ''
    app.base_url: '%env(APP_BASE_URL)%'
    app.mailer.sender_address: '%env(MAILER_FROM_ADDRESS)%'
    app.mailer.sender_name: '%env(MAILER_FROM_NAME)%'
    app.media.upload_directory: '%kernel.project_dir%/var/uploads'
    app.media.max_image_bytes: 10485760
    app.media.max_video_bytes: 104857600

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Infrastructure/Media/R2MediaStorage.php'
            - '../src/Infrastructure/Media/R2StorageCheck.php'

    App\Application\Media\MediaUploadValidator:
        arguments:
            $maxImageBytes: '%app.media.max_image_bytes%'
            $maxVideoBytes: '%app.media.max_video_bytes%'

    App\Infrastructure\Media\LocalMediaStorage:
        arguments:
            $uploadDirectory: '%app.media.upload_directory%'

    App\EventSubscriber\SecurityResponseHeadersSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    App\Application\Media\MediaStorageInterface:
        factory: ['@App\Infrastructure\Media\MediaStorageFactory', 'create']

    App\Infrastructure\Media\MediaStorageFactory:
        arguments:
            $driver: '%env(MEDIA_STORAGE)%'
            $endpoint: '%env(MEDIA_R2_ENDPOINT)%'
            $region: '%env(MEDIA_R2_REGION)%'
            $bucket: '%env(MEDIA_R2_BUCKET)%'
            $accessKeyId: '%env(MEDIA_R2_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(MEDIA_R2_SECRET_ACCESS_KEY)%'

    App\Application\Media\MediaUploadService:
        arguments:
            $mediaUploadLimiter: '@limiter.media_upload'

    app.database_session_handler:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        factory: ['@App\Infrastructure\Security\DatabaseSessionHandlerFactory', 'create']
        lazy: true

    app.security_lock_factory:
        alias: lock.factory

    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_global'
            $localFactory: '@limiter.login_local'
            # Stable across builds/instances; never use container.build_hash here.
            $secret: '%kernel.secret%'

    App\Command\CheckProductionConfigCommand:
        arguments:
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'
            $appSecret: '%env(APP_SECRET)%'
            $databaseUrl: '%env(DATABASE_URL)%'
            $mailerDsn: '%env(MAILER_DSN)%'
            $mailerFromAddress: '%env(MAILER_FROM_ADDRESS)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'
            $appBaseUrl: '%env(APP_BASE_URL)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
