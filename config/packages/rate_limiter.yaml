framework:
    rate_limiter:
        login_local:
            policy: fixed_window
            limit: 5
            interval: '1 minute'
            storage_service: App\Infrastructure\Security\DatabaseRateLimiterStorage
            lock_factory: app.security_lock_factory
        login_global:
            policy: fixed_window
            limit: 25
            interval: '1 minute'
            storage_service: App\Infrastructure\Security\DatabaseRateLimiterStorage
            lock_factory: app.security_lock_factory
