# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    exceptions:
        Symfony\Component\Security\Core\Exception\LogoutException:
            status_code: 403

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        cache:
            pools:
                cache.rate_limiter:
                    adapter: cache.adapter.array
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        # Railway terminates HTTPS at its edge proxy. Trust only the immediate
        # peer so Symfony sees the original scheme and client address.
        trusted_proxies: 'REMOTE_ADDR'
        trusted_headers:
            - 'x-forwarded-for'
            - 'x-forwarded-host'
            - 'x-forwarded-proto'
            - 'x-forwarded-port'
