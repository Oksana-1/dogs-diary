# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    exceptions:
        Symfony\Component\Security\Core\Exception\LogoutException:
            status_code: 403

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        session:
            handler_id: app.database_session_handler
            cookie_secure: true
            gc_probability: 1
            gc_divisor: 100
        # The hosting edge must overwrite forwarded headers and be the only
        # ingress to the container. Recheck this on any new hosting platform.
        trusted_proxies: 'REMOTE_ADDR'
        trusted_headers:
            - 'x-forwarded-for'
            - 'x-forwarded-host'
            - 'x-forwarded-proto'
            - 'x-forwarded-port'
